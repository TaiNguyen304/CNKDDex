<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Wheel of Fortune - Player</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #fff; font-family: sans-serif; }
        .wheel-wrapper { position: relative; }
        #wheel { width: 780px; transition: transform 15s linear; }
        #pointer { position: absolute; bottom: 20px; left: 50%; margin-left: -20px; width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 40px solid green; z-index: 10; }
        .controls { margin-top: 30px; }
        button { padding: 20px 50px; font-size: 24px; cursor: pointer; background: gold; border-radius: 10px; border: 2px solid #b8860b; }
    </style>
</head>
<body>
    <div class="wheel-wrapper">
        <img id="wheel" src="/static/Wheel.png">
        <div id="pointer"></div>
    </div>
    <div class="controls">
        <button onclick="requestSpin()">SPIN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();

        function requestSpin() { socket.emit('request_spin'); }

        socket.on('sync_state', (data) => {
            document.getElementById('wheel').src = '/static/' + data.wheel_name;
            document.getElementById('wheel').style.transition = "none";
            document.getElementById('wheel').style.transform = `rotate(${data.total_angle}deg)`;
        });

        socket.on('start_spin', (data) => {
            const wheel = document.getElementById('wheel');
            wheel.style.transition = "transform 15s linear";
            wheel.style.transform = `rotate(${data.total_angle}deg)`;
            new Audio('/static/Sound.mp3').play();
        });

        socket.on('update_wheel', (data) => {
            const wheel = document.getElementById('wheel');
            wheel.style.transition = "none";
            wheel.src = '/static/' + data.wheel_name;
            wheel.style.transform = "rotate(0deg)";
        });
    </script>
</body>
</html>
