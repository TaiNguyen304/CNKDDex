<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer</title>
    <style>
        :root {
            --blue: blue;
            --yellow: yellow;
            --green: green;
            --red: red;
            --pink: #ff00cc;
            --purple: purple;
            --orange: orange;
            --black: #000000;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-weight: bold !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            height: 100vh;
            max-height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #090d16;
            color: var(--white);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            background: #090d16;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .wheel-container {
            position: relative;
            width: min(94vh, 94vw, 850px);
            height: min(94vh, 94vw, 850px);
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.8));
            margin: auto;
            flex-shrink: 0;
        }

        #wheel {
            width: 100%;
            height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            will-change: transform;
        }

        /* Kim Viewer: Xanh lá viền trắng dày, đầu nhọn chạm sát mép nón */
        .pointer-box {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 10px rgba(0, 128, 0, 0.9));
            scale: 1.25;
        }
    </style>
</head>
<body>
    <div class="wheel-container">
        <img id="wheel" src="/static/Wheel.png" alt="Wheel of Fortune">
        <div class="pointer-box">
            <svg viewBox="0 0 40 46" width="40" height="46">
                <polygon points="20,3 37,42 3,42" fill="var(--green)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        // Chặn DevTools và chuột phải
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.shiftKey && ['I','J','C','i','j','c'].includes(e.key) || ['U','u','S','s'].includes(e.key))) {
                e.preventDefault(); return false;
            }
            if (e.metaKey && (e.altKey && ['I','J','C','i','j','c'].includes(e.key) || ['U','u'].includes(e.key))) {
                e.preventDefault(); return false;
            }
        });

        // Kiểm tra tham số ?roomid trên URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomid') || '123456';

        // Preload audio để phát ngay lập tức không độ trễ
        const spinAudio = new Audio('/static/Sound.mp3');
        spinAudio.preload = 'auto';

        function playSpinAudio(seekTime = 0) {
            try {
                spinAudio.currentTime = seekTime;
                const playPromise = spinAudio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => console.log('Audio autoplay:', e));
                }
            } catch (err) {}
        }

        // Web Worker chạy ngầm để vòng quay luôn chuyển động đúng thời gian thực kể cả khi ẩn tab
        const workerBlob = new Blob([`
            let timer = null;
            self.onmessage = function(e) {
                if (e.data === 'start') {
                    if (timer) clearInterval(timer);
                    timer = setInterval(function() {
                        self.postMessage('tick');
                    }, 20);
                } else if (e.data === 'stop') {
                    if (timer) clearInterval(timer);
                    timer = null;
                }
            };
        `], { type: 'application/javascript' });
        const timerWorker = new Worker(URL.createObjectURL(workerBlob));

        const BACKEND_URL = window.location.protocol === 'file:' ? 'https://cnkddex.onrender.com' : '';
        const socket = BACKEND_URL ? io(BACKEND_URL, { transports: ['websocket', 'polling'] }) : io();

        const wheel = document.getElementById('wheel');

        let spinState = {
            startTime: 0,
            startAngle: 0,
            targetAngle: 0,
            duration: 13370,
            isSpinning: false
        };

        function updateWheelPhysics() {
            if (!spinState.isSpinning) return;
            const now = Date.now();
            const elapsed = now - spinState.startTime;
            const progress = Math.min(1, Math.max(0, elapsed / spinState.duration));
            const currentAngle = spinState.startAngle + (spinState.targetAngle - spinState.startAngle) * progress;

            wheel.style.transform = `rotate(${currentAngle}deg)`;

            if (progress >= 1) {
                spinState.isSpinning = false;
                timerWorker.postMessage('stop');
                wheel.style.transform = `rotate(${spinState.targetAngle}deg)`;
            }
        }

        timerWorker.onmessage = function() {
            updateWheelPhysics();
        };

        document.addEventListener('visibilitychange', updateWheelPhysics);
        window.addEventListener('focus', updateWheelPhysics);

        function updateBanner(activePlayer) {
            // Viewer chỉ hiển thị vòng quay
        }

        if (roomId) {
            socket.on('connect', () => {
                socket.emit('join_game_room', {
                    room_id: roomId,
                    role: 'viewer'
                });
            });
        }

        socket.on('sync_state', (data) => {
            // Tự động cập nhật mặt nón đang sử dụng
            if (data.wheel_name) {
                wheel.src = '/static/' + data.wheel_name;
            }
            const duration = data.spin_duration || 13370;
            const elapsed = data.elapsed || 0;

            // Tự động cập nhật góc hiện tại
            if (data.spin_start_time && elapsed < duration) {
                spinState.startTime = Date.now() - elapsed;
                spinState.startAngle = data.spin_start_angle || 0;
                spinState.targetAngle = data.spin_target_angle || data.total_angle || 0;
                spinState.duration = duration;
                spinState.isSpinning = true;

                timerWorker.postMessage('start');
                playSpinAudio(elapsed / 1000);

                function step() {
                    if (spinState.isSpinning) {
                        updateWheelPhysics();
                        requestAnimationFrame(step);
                    }
                }
                requestAnimationFrame(step);
            } else {
                spinState.isSpinning = false;
                timerWorker.postMessage('stop');
                wheel.style.transform = `rotate(${data.total_angle || 0}deg)`;
            }
            updateBanner(data.active_player);
        });

        socket.on('update_active_player', (data) => {
            updateBanner(data.active_player);
        });

        socket.on('start_spin', (data) => {
            spinState.startTime = Date.now();
            spinState.startAngle = data.start_angle !== undefined ? data.start_angle : 0;
            spinState.targetAngle = data.target_angle !== undefined ? data.target_angle : (data.total_angle || 0);
            spinState.duration = data.duration || 13370;
            spinState.isSpinning = true;

            timerWorker.postMessage('start');
            playSpinAudio(0);

            function step() {
                if (spinState.isSpinning) {
                    updateWheelPhysics();
                    requestAnimationFrame(step);
                }
            }
            requestAnimationFrame(step);
        });

        socket.on('update_wheel', (data) => {
            spinState.isSpinning = false;
            timerWorker.postMessage('stop');
            wheel.src = '/static/' + data.wheel_name;
            wheel.style.transform = "rotate(0deg)";
        });

        // --- LẮNG NGHE SOUNDBOARD TỪ CONTROLLER ---
        let viewerSfxAudio = null;

        socket.on('play_sfx', (data) => {
            if (data && data.sound_file) {
                if (viewerSfxAudio) {
                    viewerSfxAudio.pause();
                    viewerSfxAudio.currentTime = 0;
                }
                viewerSfxAudio = new Audio('/static/' + data.sound_file);
                viewerSfxAudio.play().catch(e => console.log('Viewer SFX play error:', e));
            }
        });

        socket.on('stop_sfx', () => {
            if (viewerSfxAudio) {
                viewerSfxAudio.pause();
                viewerSfxAudio.currentTime = 0;
            }
        });
    </script>
</body>
</html>
