<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player 3</title>
    <style>
        :root {
            --blue: blue;
            --yellow: yellow;
            --green: green;
            --red: red;
            --pink: #ff00cc;
            --purple: purple;
            --orange: orange;
            --black: #000000;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-weight: bold !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            height: 100vh;
            max-height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #0f172a;
            color: var(--white);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
        }

        /* Bố cục ngang: Vòng quay lớn ở một bên, Nút SPIN & Bảng điều khiển ở một bên */
        .app-layout {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 28px;
            width: 100%;
            height: 100%;
            max-width: 1280px;
        }

        .wheel-area {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
        }

        /* Kích thước vòng quay lớn tương đồng với Viewer */
        .wheel-wrapper {
            position: relative;
            width: min(68vh, 54vw, 550px);
            height: min(68vh, 54vw, 550px);
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.8));
            flex-shrink: 0;
        }

        #wheel {
            width: 100%;
            height: 100%;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            will-change: transform;
        }

        /* Kim Player 3: Xanh dương viền trắng dày, đầu nhọn chạm sát mép nón */
        .pointer-box {
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 10px rgba(0, 0, 255, 0.8));
        }

        /* Khung điều khiển đặt sang 1 bên */
        .side-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: min(280px, 30vw);
            background: rgba(30, 41, 59, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            flex-shrink: 0;
        }

        /* Nhãn Player 3: Xanh dương */
        .player-badge {
            width: 100%;
            background: var(--blue);
            color: var(--white);
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 3px 10px rgba(0, 0, 255, 0.5);
            border: 2px solid var(--white);
            text-align: center;
        }

        .room-tag {
            font-size: 0.72rem;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .status-card {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #334155;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.82rem;
            text-align: center;
            width: 100%;
            transition: all 0.2s ease;
            line-height: 1.35;
        }

        .status-card.active {
            border-color: var(--blue);
            background: rgba(0, 0, 255, 0.2);
            color: #93c5fd;
            box-shadow: 0 0 15px rgba(0, 0, 255, 0.5);
        }

        .status-card.locked {
            border-color: #64748b;
            background: rgba(15, 23, 42, 0.6);
            color: #94a3b8;
        }

        /* Nút Spin Player 3: Xanh dương */
        #spinBtn {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.4rem;
            cursor: pointer;
            background: var(--blue);
            color: var(--white);
            border: 3px solid var(--white);
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 255, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            outline: none;
        }

        #spinBtn:active:not(:disabled) {
            transform: translateY(2px) scale(0.98);
        }

        #spinBtn:disabled {
            background: var(--black) !important;
            color: #64748b !important;
            border-color: #334155 !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            transform: none !important;
            opacity: 0.6 !important;
        }

        /* Hover tất cả các nút: màu orange, chữ đen */
        button:hover:not(:disabled) {
            background: var(--orange) !important;
            color: var(--black) !important;
            border-color: var(--orange) !important;
            box-shadow: 0 0 18px rgba(255, 165, 0, 0.8) !important;
            transform: translateY(-2px);
        }

        .spin-hint {
            font-size: 0.78rem;
            color: #94a3b8;
            text-align: center;
            line-height: 1.35;
        }

        @media (max-width: 768px) {
            .app-layout {
                flex-direction: column;
                gap: 12px;
            }
            .wheel-wrapper {
                width: min(52vh, 76vw, 400px);
                height: min(52vh, 76vw, 400px);
            }
            .side-panel {
                width: 100%;
                max-width: 400px;
                padding: 12px 16px;
                gap: 10px;
            }
            #spinBtn {
                padding: 12px 20px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <script>
        // Kiểm tra 2 tham số bắt buộc trên URL: roomid và auth. Nếu thiếu thì tự động trả về index.html
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomid');
        const authKey = urlParams.get('auth');

        if (!roomId || !authKey) {
            window.location.href = '/templates/index.html';
        }
    </script>

    <div class="app-layout">
        <!-- VÒNG QUAY LỚN -->
        <div class="wheel-area">
            <div class="wheel-wrapper">
                <img id="wheel" src="/static/Wheel.png" alt="Wheel of Fortune">
                <div class="pointer-box">
                    <svg viewBox="0 0 38 44" width="38" height="44">
                        <polygon points="19,3 35,40 3,40" fill="var(--blue)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- BẢNG ĐIỀU KHIỂN & NÚT SPIN ĐẶT 1 BÊN -->
        <div class="side-panel">
            <div class="player-badge">NGƯỜI CHƠI 3 (PLAYER 3)</div>
            <div id="roomTag" class="room-tag">PHÒNG: ------</div>
            <div id="statusCard" class="status-card locked">
                <span id="statusText">ĐANG KHÓA - CHỜ LƯỢT TỪ CONTROLLER</span>
            </div>
            <button id="spinBtn" onclick="requestSpin()" disabled>SPIN</button>
            <div id="spinHint" class="spin-hint">Nút quay sẽ sáng lên khi Controller mở quyền quay cho bạn</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        // Chặn DevTools và chuột phải
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.keyCode === 123 || e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.shiftKey && ['I','J','C','i','j','c'].includes(e.key) || ['U','u','S','s'].includes(e.key))) {
                e.preventDefault(); return false;
            }
            if (e.metaKey && (e.altKey && ['I','J','C','i','j','c'].includes(e.key) || ['U','u'].includes(e.key))) {
                e.preventDefault(); return false;
            }
        });

        const MY_PLAYER_ID = 'player3';
        document.getElementById('roomTag').innerText = 'PHÒNG: ' + roomId;

        // Preload audio để phát ngay lập tức không độ trễ
        const spinAudio = new Audio('/static/Sound.mp3');
        spinAudio.preload = 'auto';

        function playSpinAudio(seekTime = 0) {
            try {
                spinAudio.currentTime = seekTime;
                const playPromise = spinAudio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => console.log('Audio autoplay:', e));
                }
            } catch (err) {}
        }

        // Web Worker chạy ngầm để vòng quay luôn chuyển động đúng thời gian thực kể cả khi ẩn tab
        const workerBlob = new Blob([`
            let timer = null;
            self.onmessage = function(e) {
                if (e.data === 'start') {
                    if (timer) clearInterval(timer);
                    timer = setInterval(function() {
                        self.postMessage('tick');
                    }, 20);
                } else if (e.data === 'stop') {
                    if (timer) clearInterval(timer);
                    timer = null;
                }
            };
        `], { type: 'application/javascript' });
        const timerWorker = new Worker(URL.createObjectURL(workerBlob));

        const BACKEND_URL = window.location.protocol === 'file:' ? 'https://cnkddex.onrender.com' : '';
        const socket = BACKEND_URL ? io(BACKEND_URL, { transports: ['websocket', 'polling'] }) : io();

        const spinBtn = document.getElementById('spinBtn');
        const statusCard = document.getElementById('statusCard');
        const statusText = document.getElementById('statusText');
        const spinHint = document.getElementById('spinHint');
        const wheel = document.getElementById('wheel');

        let spinState = {
            startTime: 0,
            startAngle: 0,
            targetAngle: 0,
            duration: 13370,
            isSpinning: false
        };

        // Khi F5/Reload/Vào trễ, nút quay luôn tự động khóa ban đầu
        spinBtn.disabled = true;

        function updateWheelPhysics() {
            if (!spinState.isSpinning) return;
            const now = Date.now();
            const elapsed = now - spinState.startTime;
            const progress = Math.min(1, Math.max(0, elapsed / spinState.duration));
            const currentAngle = spinState.startAngle + (spinState.targetAngle - spinState.startAngle) * progress;

            wheel.style.transform = `rotate(${currentAngle}deg)`;

            if (progress >= 1) {
                spinState.isSpinning = false;
                timerWorker.postMessage('stop');
                wheel.style.transform = `rotate(${spinState.targetAngle}deg)`;
            }
        }

        timerWorker.onmessage = function() {
            updateWheelPhysics();
        };

        document.addEventListener('visibilitychange', updateWheelPhysics);
        window.addEventListener('focus', updateWheelPhysics);

        function updatePlayerLockState(activePlayer) {
            if (activePlayer === MY_PLAYER_ID) {
                spinBtn.disabled = false;
                statusCard.className = 'status-card active';
                statusText.innerText = 'ĐẾN LƯỢT BẠN! HÃY BẤM SPIN ĐỂ QUAY';
                spinHint.innerText = 'Nhấn nút SPIN màu xanh dương ở trên để quay vòng';
            } else {
                spinBtn.disabled = true;
                statusCard.className = 'status-card locked';
                if (!activePlayer || activePlayer === 'none') {
                    statusText.innerText = 'ĐANG KHÓA - CHỜ LƯỢT TỪ CONTROLLER';
                } else {
                    statusText.innerText = 'ĐANG LÀ LƯỢT CỦA ' + activePlayer.toUpperCase();
                }
                spinHint.innerText = 'Nút quay đang tạm khóa';
            }
        }

        function requestSpin() {
            if (!spinBtn.disabled) {
                spinBtn.disabled = true;
                socket.emit('request_spin', {
                    room_id: roomId,
                    player: MY_PLAYER_ID
                });
            }
        }

        socket.on('connect', () => {
            // Tham gia đúng phòng với mã xác thực
            socket.emit('join_game_room', {
                room_id: roomId,
                role: MY_PLAYER_ID,
                auth: authKey
            });
        });

        socket.on('join_error', (data) => {
            // Xác thực thất bại hoặc phòng không tồn tại -> trả về index.html
            window.location.href = '/templates/index.html';
        });

        socket.on('sync_state', (data) => {
            // Cập nhật mặt nón đang sử dụng
            if (data.wheel_name) {
                wheel.src = '/static/' + data.wheel_name;
            }
            const duration = data.spin_duration || 13370;
            const elapsed = data.elapsed || 0;

            // Cập nhật góc hiện tại & trạng thái quay dở nếu vào trễ
            if (data.spin_start_time && elapsed < duration) {
                spinState.startTime = Date.now() - elapsed;
                spinState.startAngle = data.spin_start_angle || 0;
                spinState.targetAngle = data.spin_target_angle || data.total_angle || 0;
                spinState.duration = duration;
                spinState.isSpinning = true;

                timerWorker.postMessage('start');
                playSpinAudio(elapsed / 1000);

                function step() {
                    if (spinState.isSpinning) {
                        updateWheelPhysics();
                        requestAnimationFrame(step);
                    }
                }
                requestAnimationFrame(step);
            } else {
                spinState.isSpinning = false;
                timerWorker.postMessage('stop');
                wheel.style.transform = `rotate(${data.total_angle || 0}deg)`;
            }

            // Theo yêu cầu: Nếu Player mà F5/Reload/Vào trễ thì nút quay tự động khóa
            spinBtn.disabled = true;
            statusCard.className = 'status-card locked';
            statusText.innerText = 'ĐANG KHÓA - CHỜ LƯỢT TỪ CONTROLLER';
            spinHint.innerText = 'Vui lòng chờ Controller mở lượt quay tiếp theo';
        });

        socket.on('update_active_player', (data) => {
            updatePlayerLockState(data.active_player);
        });

        socket.on('start_spin', (data) => {
            spinState.startTime = Date.now();
            spinState.startAngle = data.start_angle !== undefined ? data.start_angle : 0;
            spinState.targetAngle = data.target_angle !== undefined ? data.target_angle : (data.total_angle || 0);
            spinState.duration = data.duration || 13370;
            spinState.isSpinning = true;

            timerWorker.postMessage('start');
            playSpinAudio(0);

            function step() {
                if (spinState.isSpinning) {
                    updateWheelPhysics();
                    requestAnimationFrame(step);
                }
            }
            requestAnimationFrame(step);
        });

        socket.on('update_wheel', (data) => {
            spinState.isSpinning = false;
            timerWorker.postMessage('stop');
            wheel.src = '/static/' + data.wheel_name;
            wheel.style.transform = "rotate(0deg)";
        });

        // --- LẮNG NGHE SOUNDBOARD TỪ CONTROLLER ---
        let playerSfxAudio = null;

        socket.on('play_sfx', (data) => {
            if (data && data.sound_file) {
                if (playerSfxAudio) {
                    playerSfxAudio.pause();
                    playerSfxAudio.currentTime = 0;
                }
                playerSfxAudio = new Audio('/static/' + data.sound_file);
                playerSfxAudio.play().catch(e => console.log('Player SFX play error:', e));
            }
        });

        socket.on('stop_sfx', () => {
            if (playerSfxAudio) {
                playerSfxAudio.pause();
                playerSfxAudio.currentTime = 0;
            }
        });
    </script>
</body>
</html>
